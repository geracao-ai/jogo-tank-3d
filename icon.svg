  <g stroke="#2E2A2E" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- cano -->
    <rect x="78" y="44" width="38" height="9" rx="2" fill="#5E6B47"/>
    <rect x="110" y="41" width="9" height="15" rx="2" fill="#5E6B47"/>
