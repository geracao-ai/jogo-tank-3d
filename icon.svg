  <!-- rodas -->
  <g fill="#B8A885" stroke="#2E2A2E" stroke-width="3">
    <circle cx="28" cy="91" r="8"/>
    <circle cx="49" cy="91" r="8"/>
    <circle cx="70" cy="91" r="8"/>
    <circle cx="91" cy="91" r="8"/>
  </g>
  <!-- faixa ferrugem no casco -->
  <rect x="58" y="65" width="22" height="6" rx="2" fill="#BA6145"/>
