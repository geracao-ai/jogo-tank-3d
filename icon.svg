    <path d="M36 62 L44 38 Q46 34 50 34 L76 34 Q80 34 82 38 L90 62 Z" fill="#A3AD6B"/>
    <rect x="52" y="27" width="18" height="8" rx="3" fill="#5E6B47"/>
