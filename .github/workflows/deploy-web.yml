name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Baixar Godot e templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          BASE=https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable
          mkdir -p ~/godot ~/.local/share/godot/export_templates/$GODOT_VERSION.stable
          curl -fsSL -o godot.zip $BASE/Godot_v$GODOT_VERSION-stable_linux.x86_64.zip
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v$GODOT_VERSION-stable_linux.x86_64 ~/godot/godot
          curl -fsSL -o templates.tpz $BASE/Godot_v$GODOT_VERSION-stable_export_templates.tpz
          unzip -q templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/$GODOT_VERSION.stable/

      - name: Exportar
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --path . --import
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.wasm

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
